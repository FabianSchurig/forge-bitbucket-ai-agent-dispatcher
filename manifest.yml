modules:
  trigger:
    - key: pr-comment-trigger
      function: run-dispatcher
      events:
        - avi:bitbucket:created:pullrequest-comment

  bitbucket:projectSettingsMenuPage:
    - key: settings-page
      resource: settings-ui
      render: native
      title: AI Agent Dispatcher Settings
      resolver:
        function: settings-resolver

  # Cross-product (XPA) Jira surface: a context panel on the Jira issue view
  # that lets developers dispatch a Bitbucket AI-agent pipeline straight from
  # the issue they are working on.  Declaring a jira:* module is what makes
  # this app installable on Jira in addition to Bitbucket.
  jira:issueContext:
    - key: dispatch-panel
      resource: dispatch-panel-ui
      render: native
      title: AI Agent Dispatcher
      resolver:
        function: jira-resolver

  function:
    - key: run-dispatcher
      handler: index.runDispatcher

    - key: settings-resolver
      handler: index.settingsResolver

    - key: jira-resolver
      handler: index.jiraResolver

app:
  id: ari:cloud:ecosystem::app/c692fc30-e7f5-40f2-ab84-733a61f45989 
  runtime:
    name: nodejs24.x

resources:
  - key: settings-ui
    path: src/settings.tsx
  - key: dispatch-panel-ui
    path: src/dispatchPanel.tsx

permissions:
  scopes:
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
    - write:repository:bitbucket
    - read:pipeline:bitbucket
    - write:pipeline:bitbucket
    - write:pullrequest:bitbucket
    - storage:app
    # Read Jira issue details (summary) from the issue-context panel resolver.
    - read:jira-work
  external:
    fetch:
      # Wildcard allows outbound requests to any domain.  This is a temporary
      # workaround until Atlassian promotes Customer-Managed Egress from the
      # roadmap to preview, at which point we can switch to the `configurable`
      # block and let workspace admins approve specific Jenkins hosts at runtime.
      backend:
        - '*'
