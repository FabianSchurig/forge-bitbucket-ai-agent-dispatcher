## ai-agent-pipe – Bitbucket Pipe metadata
##
## This file follows the Bitbucket Pipes specification
## (https://support.atlassian.com/bitbucket-cloud/docs/use-bitbucket-pipes/).
##
## When the pipe is invoked, Bitbucket Pipelines will:
##   1. pull the image referenced by `image`
##   2. inject every entry under `variables` as an environment variable
##      (we use the raw names already emitted by the Forge dispatcher, e.g.
##      SOURCE_WORKSPACE, COMMENT_TEXT, so no translation layer is needed)
##   3. invoke the container ENTRYPOINT (see Dockerfile -> /entrypoint.sh)

name: ai-agent-pipe
description: >-
  Run an AI agent profile inside a Bitbucket pipeline. The pipe clones the
  target repository, builds its devcontainer when present, layers the selected
  agent profile on top, and executes the agent with BuildKit-mounted secrets.

# The image tag is rewritten by the publish workflow to a concrete semver /
# sha tag on every push to `main` and on every GitHub Release.  The `:latest`
# default here exists purely so the file is valid out-of-the-box; pin to a
# semver tag in production usage.
image: ghcr.io/fabianschurig/forge-bitbucket-ai-agent-dispatcher/ai-agent-pipe:latest

# Semver of the pipe itself.  Bump on every behavioural change.
version: 0.4.0

# Inputs the dispatcher (or a human operator) can supply.  Each input is
# mapped to an env var of the same name by entrypoint.sh.
#
# Note: Bitbucket Pipes conventionally use UPPER_SNAKE_CASE because variables
# are exposed as plain environment variables inside the container.  We mirror
# the variables the Forge dispatcher already emits (see
# src/pipelinePayload.ts) so no translation layer is needed.
variables:
  AGENT_TYPE:
    description: Agent profile to run, "copilot" or "cursor". Each needs its own token, see below.
    required: false
    default: "copilot"
  AGENT_MODEL:
    description: Model override for the agent. Empty uses the profile's default.
    required: false
    default: ""
  READ_ONLY:
    description: '"true" starts bb-mcp with GET operations only, so the agent can read the pull request but not post to it; it prints its result instead.'
    required: false
    default: "false"
  SOURCE_WORKSPACE:
    description: Bitbucket workspace slug of the spoke repository.
    required: true
  SOURCE_REPO:
    description: Repository slug of the spoke repository.
    required: true
  SOURCE_BRANCH:
    description: Branch of the spoke repository to check out.
    required: true
  PR_ID:
    description: Pull-request numeric ID that triggered the agent, so it can self-serve PR context through bb-mcp. Without it the run is not about a pull request.
    required: false
    default: ""
  COMMENT_TEXT:
    description: Raw text of the triggering PR comment – used as the agent prompt.
    required: true
  AGENT_FEATURE:
    description: Devcontainer feature that installs the agent's skills and MCP servers from the Werfen marketplace, added to the agent image with --additional-features. "none" builds without it.
    required: false
    default: "artifactory-munich.werfen.global:6556/werfen/devcontainer-features/werfen-ai-agent:1"
  AGENT_PLUGINS:
    description: Comma-separated marketplace plugins the feature installs.
    required: false
    default: "bitbucket"
  COMMENT_AUTHOR:
    description: Atlassian account ID of the comment author (for audit logs).
    required: false
    default: ""
  DEVCONTAINER_CONFIG:
    description: Path of the devcontainer.json to build, relative to the repository root. Needed only when the repository has several .devcontainer/<name>/devcontainer.json files.
    required: false
    default: ""
  SOURCE_CLONE_URL:
    description: Clone URL of the source repository. Defaults to git@bitbucket.org:SOURCE_WORKSPACE/SOURCE_REPO.git.
    required: false
    default: ""
  SSH_KNOWN_HOSTS:
    description: Extra known_hosts lines, for a SOURCE_CLONE_URL on a host other than bitbucket.org.
    required: false
    default: ""
  OTEL_EXPORTER_OTLP_ENDPOINT:
    description: OTLP/HTTP base URL; turns OpenTelemetry tracing of the agent run on. OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL, OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES and TRACEPARENT are passed through too.
    required: false
    default: ""
  JAMA_MCP_GATEWAY_URL:
    description: Streamable HTTP endpoint of a Jama MCP gateway. With JAMA_MCP_GATEWAY_TOKEN it replaces the Jama MCP server of the installed MCP config.
    required: false
    default: ""
  JAMA_MCP_SERVER:
    description: Name of the Jama MCP server that JAMA_MCP_GATEWAY_URL replaces. Defaults to werfen-jama.
    required: false
    default: ""

  # --- Secrets ----------------------------------------------------------
  # These MUST be marked as "Secured" in the Bitbucket repository variables
  # UI so they are masked in build logs and never written to disk in plain
  # text outside of /tmp (which is tmpfs in Pipelines runners).
  COPILOT_GITHUB_TOKEN:
    description: GitHub token (fine-grained PAT or OAuth) for the copilot profile; required when AGENT_TYPE is copilot. COPILOT_TOKEN is accepted as a legacy alias.
    required: false
  CURSOR_API_KEY:
    description: Cursor API key for the cursor profile; required when AGENT_TYPE is cursor.
    required: false
  BITBUCKET_TOKEN:
    description: Bitbucket API token used by bb-mcp. With BITBUCKET_USERNAME it uses username/token auth; without a username it uses Bearer auth. BB_TOKEN is accepted as a legacy alias.
    required: true
  BITBUCKET_USERNAME:
    description: Optional Bitbucket username used with BITBUCKET_TOKEN for username/token auth. Omit it to use Bearer auth. BB_USERNAME is accepted as a legacy alias.
    required: false
    default: ""
  SSH_KEY:
    description: Unencrypted SSH private key used to clone the spoke repository, as PEM/OpenSSH text or base64 of it (Bitbucket's recommended way to store a key in a variable).
    required: true
  OTEL_EXPORTER_OTLP_HEADERS:
    description: k=v,k2=v2 OTLP request headers, typically the collector credential. OTEL_EXPORTER_OTLP_TRACES_HEADERS is accepted too. Mounted as a secret, never a build arg.
    required: false
  ATLASSIAN_MCP_API_KEY:
    description: Optional API key sent as an Authorization Bearer header to the HTTP MCP server named atlassian, if the installed MCP config has one. Without it that server keeps its browser sign-in. Mounted as a secret, never a build arg.
    required: false
  JAMA_MCP_GATEWAY_TOKEN:
    description: Optional Jama MCP gateway token. With JAMA_MCP_GATEWAY_URL the Jama MCP server of the installed MCP config is replaced by the gateway, sent this token as an Authorization Bearer header. Mounted as a secret, never a build arg.
    required: false
