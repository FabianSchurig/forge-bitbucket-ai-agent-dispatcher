# ---------------------------------------------------------------------------
# Tests the ai-agent-pipe image and the scripts it ships, on every change to
# them. publish-pipe.yml calls this workflow and publishes only if it passes.
# ---------------------------------------------------------------------------
name: Test Pipe Scripts

on:
  push:
    branches: [ main ]
    paths:
      - 'pipe/**'
      - 'scripts/**'
      - '.github/workflows/test-pipe-scripts.yml'
  pull_request:
    paths:
      - 'pipe/**'
      - 'scripts/**'
      - '.github/workflows/test-pipe-scripts.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning -x pipe/entrypoint.sh pipe/scripts/*.sh pipe/config/agents/*/install.sh \
            pipe/test/*/run.sh scripts/*/*.sh

  otlp-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: otlp-trace.sh
        run: pipe/test/otlp-trace/run.sh

      # Debian bookworm ships jq 1.6, which many devcontainer base images still use.
      - name: otlp-trace.sh on jq 1.6
        run: |
          docker run --rm -v "$PWD/pipe:/pipe:ro" debian:bookworm bash -c \
            'apt-get update -qq && apt-get install -y -qq jq curl python3 >/dev/null && /pipe/test/otlp-trace/run.sh'

  execute-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: execute.sh MCP config
        run: pipe/test/execute-mcp/run.sh

      - name: execute.sh MCP config on jq 1.6
        run: |
          docker run --rm -v "$PWD/pipe:/pipe:ro" debian:bookworm bash -c \
            'apt-get update -qq && apt-get install -y -qq jq gettext-base >/dev/null && /pipe/test/execute-mcp/run.sh'

  pipe-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pipe image end to end
        run: pipe/test/pipe-e2e/run.sh
