# ---------------------------------------------------------------------------
# Smoke test: triggers a Bitbucket on-demand pipeline using the freshly
# published ai-agent-pipe image against a designated test target repo,
# then polls the resulting pipeline until completion and asserts that the
# Copilot CLI was actually invoked.
#
# Required repository secrets:
#   BB_APP_PASSWORD       - Bitbucket app password or access token with `pipelines:write`
#   BB_USERNAME           - Optional Bitbucket username for HTTP Basic auth.
#                           Omit it to use BB_APP_PASSWORD as a Bearer token.
#   BB_TEST_WORKSPACE     - Workspace slug owning the test target repo
#   BB_TEST_REPO          - Repo slug of the test target repo
#   BB_TEST_BRANCH        - Branch to run against (defaults to `main`)
#
# The Bitbucket test repository must define these secured repository variables:
#   COPILOT_GITHUB_TOKEN, BITBUCKET_TOKEN, SSH_KEY
#   Optional: BITBUCKET_USERNAME when testing username/token auth instead of Bearer auth.
#
# Trigger: after `Publish Pipe` succeeds on `main`, or manually.
# ---------------------------------------------------------------------------
name: Smoke Test Pipe

on:
  workflow_run:
    workflows: [ "Publish Pipe" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to smoke-test (e.g. main, sha-abc1234, v0.1.0)'
        required: false
        default: 'main'

# Only run if the upstream publish actually succeeded.
jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Bitbucket on-demand pipeline
        id: trigger
        env:
          BB_USERNAME: ${{ secrets.BB_USERNAME }}
          BB_APP_PASSWORD: ${{ secrets.BB_APP_PASSWORD }}
          BB_TEST_WORKSPACE: ${{ secrets.BB_TEST_WORKSPACE }}
          BB_TEST_REPO: ${{ secrets.BB_TEST_REPO }}
          BB_TEST_BRANCH: ${{ secrets.BB_TEST_BRANCH }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'main' }}
        run: scripts/smoke-test-pipe/trigger.sh

      - name: Poll pipeline until completion
        env:
          BB_USERNAME: ${{ secrets.BB_USERNAME }}
          BB_APP_PASSWORD: ${{ secrets.BB_APP_PASSWORD }}
          BB_TEST_WORKSPACE: ${{ secrets.BB_TEST_WORKSPACE }}
          BB_TEST_REPO: ${{ secrets.BB_TEST_REPO }}
          PIPELINE_UUID: ${{ steps.trigger.outputs.pipeline_uuid }}
        run: scripts/smoke-test-pipe/poll.sh
