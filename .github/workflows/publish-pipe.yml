# ---------------------------------------------------------------------------
# Publishes the ai-agent-pipe Docker image to GitHub Container Registry.
#
# Triggers:
#   - push to `main` that touches any file under `pipe/` (or this workflow)
#     -> publishes :main and :sha-<short>
#   - GitHub Release published
#     -> publishes :<release-tag> and :latest
#   - manual workflow_dispatch (for re-publishing without a code change)
#
# The image is tagged into the repo's own GHCR namespace so it lives at
#   ghcr.io/fabianschurig/forge-bitbucket-ai-agent-dispatcher/ai-agent-pipe:<tag>
# ---------------------------------------------------------------------------
name: Publish Pipe

on:
  push:
    branches: [ main ]
    paths:
      - 'pipe/**'
      - '.github/workflows/publish-pipe.yml'
  release:
    types: [ published ]
  workflow_dispatch:

# Allow only one concurrent publish for a given ref – cancels superseded
# runs so we don't push a stale image after a fast follow-up commit.
concurrency:
  group: publish-pipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Minimal permissions per security guidance in the ticket: only what's
    # needed to push to GHCR.  contents:read lets the checkout action read
    # the repo; everything else stays default-deny.
    permissions:
      contents: read
      packages: write

    env:
      # Lowercase the owner/repo because GHCR rejects mixed-case names.
      IMAGE_REPO: ghcr.io/${{ github.repository }}/ai-agent-pipe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase IMAGE_REPO
        id: repo
        run: echo "image_repo=$(echo '${{ env.IMAGE_REPO }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action computes the full tag matrix for us:
      #   - branch name on push to main
      #   - semver tags on releases (vX.Y.Z, X.Y, X, latest)
      #   - sha-<short> always
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercase via the action itself (the env above is already
          # lowercase for our repo, but kept consistent).
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./pipe
          file: ./pipe/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend keeps subsequent builds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
